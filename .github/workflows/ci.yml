name: PulseSync CI Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Android Client CI: Unit Tests, Build Verification & APK Packaging
  # ---------------------------------------------------------------------------
  android-build-and-test:
    name: Android Client (Build & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Run Android Unit Tests
        run: ./gradlew test --stacktrace --continue

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Android Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Backend ASP.NET Core 8 Web API: Build & xUnit Test Verification
  # ---------------------------------------------------------------------------
  backend-build-and-test:
    name: Backend API (Build & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore backend/PulseSync.sln || dotnet restore backend/PulseSync.Api/PulseSync.Api.csproj

      - name: Build Backend Service
        run: dotnet build backend/PulseSync.Api/PulseSync.Api.csproj --configuration Release --no-restore

      - name: Run Backend xUnit Tests
        run: dotnet test backend/PulseSync.Tests/PulseSync.Tests.csproj --configuration Release --verbosity normal
